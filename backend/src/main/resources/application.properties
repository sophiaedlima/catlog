spring.application.name=catlog-api
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catlog}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_SENHA:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

catlog.jwt.segredo=${JWT_SEGREDO}
catlog.jwt.validade-horas=168
catlog.fuso=America/Sao_Paulo

catlog.fotos.pasta=${FOTOS_PASTA:uploads}
catlog.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
catlog.cloudinary.api-key=${CLOUDINARY_API_KEY:}
catlog.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

catlog.nominatim.contato=${NOMINATIM_CONTATO:}
catlog.dev.senha-teste=${CATLOG_SENHA_TESTE:}
